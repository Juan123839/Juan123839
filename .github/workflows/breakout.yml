
name: Generate Red Breakout

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Red Breakout
        uses: cyprieng/github-breakout@v1
        with:
          github_username: ${{ github.repository_owner }}
          ball_color: "#FFE4E6"
          paddle_color: "#FB4565"
          bricks_colors: "#320A13,#6B1025,#9F1239,#E11D48,#FB7185"

      - name: Prepare animation
        run: |
          mkdir -p /tmp/breakout-images
          mv output/custom.svg /tmp/breakout-images/breakout-red.svg

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish animation
        run: |
          git checkout --orphan github-breakout
          git rm -rf .
          mkdir -p images
          mv /tmp/breakout-images/* images/
          git add images
          git commit -m "Update red breakout"
          git push --force origin github-breakout
