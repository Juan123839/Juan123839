
name: Generate Red Breakout

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Red Breakout
        uses: cyprieng/github-breakout@v1
        with:
          github_username: ${{ github.repository_owner }}
          ball_color: "#FFE4E6"
          paddle_color: "#FB4565"
          bricks_colors: "#320A13,#6B1025,#9F1239,#E11D48,#FB7185"

      - name: Save SVG
        run: |
          mkdir -p images
          cp output/custom.svg images/breakout-red.svg
          test -s images/breakout-red.svg

      - name: Publish SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/breakout-red.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update red breakout animation"
            git push
          fi
