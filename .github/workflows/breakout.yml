
name: Generate Red Breakout

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Generate Red Breakout Animation
        uses: cyprieng/github-breakout@v1
        with:
          github_username: Juan123839
          ball_color: "#FFE4E6"
          paddle_color: "#FB4565"
          bricks_colors: "#320A13,#6B1025,#9F1239,#E11D48,#FB7185"
          enable_ghost_bricks: true
          output_path: "./output/"

      - name: Verify generated animation
        run: |
          if [ ! -s output/custom.svg ]; then
            echo "Error: Breakout SVG was not generated"
            exit 1
          fi

      - name: Save Red Breakout SVG
        run: |
          mkdir -p images
          cp output/custom.svg images/breakout-red.svg

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push Animation
        run: |
          git add images/breakout-red.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update red breakout animation"
            git push origin HEAD:main
          fi
